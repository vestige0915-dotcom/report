<svg viewBox="0 0 900 500" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 渐变材质定义 -->
    <linearGradient id="silver" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b2bec3" />
      <stop offset="50%" stop-color="#dfe6e9" />
      <stop offset="100%" stop-color="#636e72" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e1b12c" />
      <stop offset="50%" stop-color="#fbc531" />
      <stop offset="100%" stop-color="#c23616" />
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00b894" />
      <stop offset="100%" stop-color="#006266" />
    </linearGradient>
    
    <!-- 发光滤镜 -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      text { font-family: 'Microsoft YaHei', sans-serif; }
      
      /* 顶部连接处动画（向左插入，再向下锁死） */
      .top-leg {
        animation: topAssemble 6s ease-in-out infinite;
      }
      @keyframes topAssemble {
        0%, 15% { transform: translate(35px, -18px); } /* 拆解状态 */
        30% { transform: translate(0px, -18px); }      /* 插入卡槽 */
        45%, 85% { transform: translate(0px, 0px); }   /* 向下锁紧锁定 */
        100% { transform: translate(35px, -18px); }    /* 复位 */
      }

      /* 底部连接处动画（等顶部锁死后，向下盖入） */
      .bottom-plate {
        animation: bottomAssemble 6s ease-in-out infinite;
      }
      @keyframes bottomAssemble {
        0%, 40% { transform: translate(0px, -100px); opacity: 0; } /* 隐藏等待 */
        50% { transform: translate(0px, -100px); opacity: 1; }     /* 出现 */
        65%, 85% { transform: translate(0px, 0px); opacity: 1; }   /* 落入锁死 */
        100% { transform: translate(0px, -100px); opacity: 0; }    /* 复位 */
      }

      /* 锁紧高亮提示动画 */
      .lock-highlight {
        animation: pulseLock 6s ease-in-out infinite;
        opacity: 0;
      }
      @keyframes pulseLock {
        0%, 45% { opacity: 0; }
        50%, 80% { opacity: 1; }
        85%, 100% { opacity: 0; }
      }
      
      .arrow {
        animation: arrowFade 6s ease-in-out infinite;
      }
      @keyframes arrowFade {
        0%, 20% { opacity: 1; }
        45%, 100% { opacity: 0; }
      }
    </style>
  </defs>

  <!-- 背景 -->
  <rect width="100%" height="100%" fill="#1e272e" />

  <!-- 顶部大标题 -->
  <text x="450" y="40" fill="#ffffff" font-size="22" font-weight="bold" text-anchor="middle" letter-spacing="2">免螺丝快装方案：冲压挂钩 + 承重自锁</text>
  <line x1="100" y1="60" x2="800" y2="60" stroke="#485460" stroke-width="2" />

  <!-- 中间分隔线 -->
  <line x1="450" y1="80" x2="450" y2="450" stroke="#485460" stroke-width="2" stroke-dasharray="8,8" />

  <!-- ================= 左侧模块：顶部连接 ================= -->
  <g transform="translate(40, 60)">
    <text x="180" y="40" fill="#00cec9" font-size="18" font-weight="bold" text-anchor="middle">步骤 1：顶部支架侧挂自锁</text>
    <text x="180" y="65" fill="#a4b0be" font-size="12" text-anchor="middle">利用折弯挂钩穿过外圈卡槽，向下受力锁死</text>

    <!-- 顶圈 (固定不动) -->
    <rect x="120" y="100" width="18" height="280" fill="url(#silver)" rx="2" />
    <!-- 顶圈卡槽 1 -->
    <rect x="115" y="140" width="28" height="40" fill="#1e272e" />
    <!-- 顶圈卡槽 2 -->
    <rect x="115" y="270" width="28" height="40" fill="#1e272e" />
    
    <text x="90" y="125" fill="#dfe6e9" font-size="14" text-anchor="end">餐炉顶圈</text>
    <path d="M 95 120 L 115 120" stroke="#dfe6e9" stroke-width="1" />

    <!-- 动画部件：支架腿上部 -->
    <g class="top-leg">
      <!-- 支架腿主干 -->
      <rect x="138" y="100" width="26" height="280" fill="url(#gold)" rx="2" />
      
      <!-- 挂钩 1 (锁死状态的坐标：底部贴合卡槽底部 Y=180) -->
      <!-- 卡槽1的底部是 Y=180。挂钩底部是 Y=180，顶部是 164 -->
      <path d="M 138 164 L 108 164 L 108 190 L 120 190 L 120 180 L 138 180 Z" fill="url(#gold)" />
      
      <!-- 挂钩 2 (锁死状态的坐标：底部贴合卡槽底部 Y=310) -->
      <!-- 卡槽2的底部是 Y=310。挂钩底部是 Y=310，顶部是 294 -->
      <path d="M 138 294 L 108 294 L 108 320 L 120 320 L 120 310 L 138 310 Z" fill="url(#gold)" />

      <text x="180" y="150" fill="#fbc531" font-size="14">支架腿与冲压挂钩</text>
      <path d="M 175 145 L 140 165" stroke="#fbc531" stroke-width="1" />
      
      <!-- 运动指示箭头 -->
      <g class="arrow">
        <path d="M 100 170 L 80 170 L 85 165 M 80 170 L 85 175" stroke="#e74c3c" stroke-width="2" fill="none"/>
        <path d="M 130 200 L 130 220 L 125 215 M 130 220 L 135 215" stroke="#e74c3c" stroke-width="2" fill="none"/>
      </g>
    </g>

    <!-- 锁紧高亮特效 -->
    <circle cx="115" cy="184" r="14" fill="none" stroke="#00cec9" stroke-width="3" filter="url(#glow)" class="lock-highlight" />
    <circle cx="115" cy="314" r="14" fill="none" stroke="#00cec9" stroke-width="3" filter="url(#glow)" class="lock-highlight" />
  </g>

  <!-- ================= 右侧模块：底部连接 ================= -->
  <g transform="translate(480, 60)">
    <text x="180" y="40" fill="#00cec9" font-size="18" font-weight="bold" text-anchor="middle">步骤 2：底板定位与张力支撑</text>
    <text x="180" y="65" fill="#a4b0be" font-size="12" text-anchor="middle">底板孔对准定位销盖下，锁定支架防止向内收缩</text>

    <!-- 支架腿底部 (固定不动) -->
    <!-- 垂直部分 -->
    <rect x="60" y="100" width="24" height="230" fill="url(#gold)" />
    <!-- 水平折弯部分 -->
    <rect x="60" y="330" width="160" height="24" fill="url(#gold)" rx="4"/>
    <path d="M 60 330 Q 60 354 84 354 L 60 354 Z" fill="url(#gold)" /> <!-- 补全内圆角 -->

    <!-- 向上定位销/凸起 (从钣金上冲压折弯出来) -->
    <rect x="150" y="300" width="14" height="30" fill="url(#gold)" rx="3" />
    
    <text x="240" y="345" fill="#fbc531" font-size="14">支架腿底部支撑面</text>
    <text x="190" y="295" fill="#fbc531" font-size="14">定位销</text>
    <path d="M 185 290 L 165 305" stroke="#fbc531" stroke-width="1" />

    <!-- 动画部件：燃烧器底板 -->
    <g class="bottom-plate">
      <!-- 底板厚度 (Y=314，放在Y=330的水平面上，厚度16) -->
      <!-- 左半边底板 -->
      <rect x="10" y="314" width="138" height="16" fill="url(#green)" rx="2" />
      <!-- 右半边底板 -->
      <rect x="166" y="314" width="110" height="16" fill="url(#green)" rx="2" />
      
      <text x="120" y="280" fill="#00b894" font-size="14" font-weight="bold">中心燃料底板 (重力下压)</text>
      
      <!-- 运动指示箭头 -->
      <g class="arrow">
        <path d="M 157 230 L 157 270 L 152 265 M 157 270 L 162 265" stroke="#e74c3c" stroke-width="3" fill="none"/>
      </g>
    </g>

    <!-- 锁紧高亮特效 -->
    <circle cx="157" cy="322" r="18" fill="none" stroke="#00cec9" stroke-width="3" filter="url(#glow)" class="lock-highlight" />
  </g>

</svg>