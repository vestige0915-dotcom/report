<svg viewBox="0 0 900 500" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 材质渐变 -->
    <linearGradient id="silver" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b2bec3" />
      <stop offset="50%" stop-color="#dfe6e9" />
      <stop offset="100%" stop-color="#636e72" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e1b12c" />
      <stop offset="50%" stop-color="#fbc531" />
      <stop offset="100%" stop-color="#c23616" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      text { font-family: 'Microsoft YaHei', sans-serif; }
      
      /* 方案A：阻尼凸点动画 */
      .dimple-leg {
        animation: dimpleAnim 7s ease-in-out infinite;
      }
      @keyframes dimpleAnim {
        0%, 10% { transform: translate(30px, -16px); } /* 拆解 */
        25% { transform: translate(0px, -16px); }      /* 插入 */
        40%, 62% { transform: translate(0px, 0px); }    /* 锁紧 */
        68% { transform: translate(0px, -3px); }       /* 向上撞击力作用：被凸点卡住，仅微动 */
        74%, 85% { transform: translate(0px, 0px); }    /* 恢复锁紧 */
        95%, 100% { transform: translate(30px, -16px); }/* 拆卸 */
      }

      /* 方案A：咔哒锁死绿色闪光 */
      .snap-ring {
        animation: snapRingAnim 7s ease-in-out infinite;
        transform-origin: 152px 216px;
      }
      @keyframes snapRingAnim {
        0%, 38% { transform: scale(0); opacity: 0; }
        40% { transform: scale(1); opacity: 1; }
        48%, 100% { transform: scale(2.8); opacity: 0; }
      }

      /* 方案B：L形卡槽动画 (前视图视角) */
      .l-peg {
        animation: lSlotAnim 7s ease-in-out infinite;
      }
      @keyframes lSlotAnim {
        0%, 10% { transform: translate(50px, -39px); opacity: 0; } /* 拆解 */
        15% { transform: translate(50px, -39px); opacity: 1; }      /* 挂钩穿过卡槽 */
        28% { transform: translate(0px, -39px); opacity: 1; }       /* 横向滑入 */
        40%, 62% { transform: translate(0px, 0px); opacity: 1; }     /* 落入底部锁死 */
        68% { transform: translate(0px, -35px); opacity: 1; }      /* 向上撞击力作用：被顶部钣金顶住，无法脱出 */
        74%, 85% { transform: translate(0px, 0px); opacity: 1; }     /* 恢复重力锁紧 */
        92% { transform: translate(50px, -39px); opacity: 1; }      /* 逆向拆卸 */
        97%, 100% { transform: translate(50px, -39px); opacity: 0; }
      }

      /* 模拟向上的意外撞击力（红色箭头） */
      .force-arrow {
        animation: forceArrowAnim 7s ease-in-out infinite;
      }
      @keyframes forceArrowAnim {
        0%, 64% { opacity: 0; transform: translateY(15px); }
        67%, 71% { opacity: 1; transform: translateY(0px); }
        75%, 100% { opacity: 0; transform: translateY(-10px); }
      }
    </style>
  </defs>

  <!-- 背景 -->
  <rect width="100%" height="100%" fill="#1a1e24" />

  <!-- 标题 -->
  <text x="450" y="45" fill="#ffffff" font-size="20" font-weight="bold" text-anchor="middle" letter-spacing="1">两种免螺丝“防意外向上脱落”改良方案</text>
  <line x1="80" y1="65" x2="820" y2="65" stroke="#2d3436" stroke-width="2" />
  <line x1="450" y1="85" x2="450" y2="450" stroke="#2d3436" stroke-width="1.5" stroke-dasharray="5,5" />

  <!-- ================= 左面板：方案 A（阻尼凸点） ================= -->
  <g transform="translate(40, 40)">
    <text x="180" y="55" fill="#0984e3" font-size="16" font-weight="bold" text-anchor="middle">方案 A：冲压阻尼防脱凸点 (侧视图)</text>
    <text x="180" y="78" fill="#95a5a6" font-size="12" text-anchor="middle">利用过盈配合，滑入时“咔哒”卡死防止反向滑动</text>

    <!-- 顶圈截面 -->
    <rect x="150" y="120" width="12" height="240" fill="url(#silver)" rx="1" />
    <rect x="148" y="160" width="16" height="50" fill="#1a1e24" /> <!-- 卡槽口 -->

    <g class="dimple-leg">
      <!-- 支架腿 -->
      <rect x="166" y="80" width="20" height="280" fill="url(#gold)" rx="2" />
      <!-- 带有凸点的挂钩 -->
      <path d="M 166 194 L 142 194 L 142 230 L 152 230 L 152 210 L 166 210 Z" fill="url(#gold)" />
      <!-- 阻尼凸点 (高0.8mm左右) -->
      <circle cx="152" cy="216" r="4.5" fill="#ffeaa7" stroke="#d63031" stroke-width="1" />
      <text x="159" y="225" fill="#ff7675" font-size="11" font-weight="bold">凸点</text>
      
      <!-- 咔哒锁紧绿光特效 -->
      <circle cx="152" cy="216" r="8" fill="none" stroke="#2ecc71" stroke-width="3" filter="url(#glow)" class="snap-ring" />
    </g>

    <!-- 标志说明 -->
    <text x="210" y="340" fill="#f1c40f" font-size="12">支架腿</text>
    <text x="90" y="310" fill="#bdc3c7" font-size="12">顶圈外壁</text>

    <!-- 向上撞击力红色箭头 -->
    <g class="force-arrow">
      <path d="M 186 380 L 186 335 M 181 342 L 186 335 L 191 342" stroke="#d63031" stroke-width="3" fill="none" />
      <rect x="200" y="340" width="110" height="22" fill="#d63031" rx="3" opacity="0.9"/>
      <text x="255" y="355" fill="#ffffff" font-size="11" text-anchor="middle" font-weight="bold">意外向上撞击力</text>
    </g>
  </g>

  <!-- ================= 右面板：方案 B（L形卡槽） ================= -->
  <g transform="translate(480, 40)">
    <text x="180" y="55" fill="#0984e3" font-size="16" font-weight="bold" text-anchor="middle">方案 B：L形安全防脱卡槽 (外前视图)</text>
    <text x="180" y="78" fill="#95a5a6" font-size="12" text-anchor="middle">采用几何限位，向上撞击时被顶壁阻挡无法脱出</text>

    <!-- 顶圈板面 -->
    <rect x="90" y="120" width="180" height="240" rx="6" fill="url(#silver)" />
    
    <!-- L形卡槽孔 -->
    <path d="M 180 170 H 230 V 200 H 180 V 240 H 140 V 170 Z" fill="#1a1e24" />
    <text x="145" y="155" fill="#bdc3c7" font-size="11">L形安全卡槽孔</text>

    <!-- 挂钩截面（用金色方块代表挂钩销轴） -->
    <g class="l-peg">
      <rect x="145" y="212" width="30" height="24" rx="2" fill="url(#gold)" stroke="#e1b12c" stroke-width="1.5" filter="url(#glow)"/>
      <text x="160" y="228" fill="#ffffff" font-size="11" text-anchor="middle" font-weight="bold">挂钩</text>
    </g>

    <!-- 锁死位置指示 -->
    <path d="M 140 170 L 180 170" stroke="#2ecc71" stroke-width="3" stroke-dasharray="4,2" />
    <text x="195" y="165" fill="#2ecc71" font-size="11" font-weight="bold">防脱顶壁</text>

    <!-- 向上撞击力红色箭头 -->
    <g class="force-arrow">
      <path d="M 160 380 L 160 335 M 155 342 L 160 335 L 165 342" stroke="#d63031" stroke-width="3" fill="none" />
      <rect x="175" y="340" width="110" height="22" fill="#d63031" rx="3" opacity="0.9"/>
      <text x="230" y="355" fill="#ffffff" font-size="11" text-anchor="middle" font-weight="bold">意外向上撞击力</text>
    </g>
  </g>
</svg>